<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:," />
  <title>猫武士星图</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="graph"></div>
  <div id="family" hidden></div>

  <div id="topbar">
    <div class="search">
      <input id="search" type="search" placeholder="搜索猫名（中 / 英）" autocomplete="off" />
      <ul id="results" hidden></ul>
    </div>
    <div class="tools" id="galaxyTools">
      <button id="bloomBtn" type="button">辉光 开</button>
      <span id="fps"></span>
    </div>
    <div class="tools" id="familyTools" hidden>
      <span id="famTitle"></span>
      <div class="stepper"><span>上</span><button data-dir="up" data-step="-1" type="button">−</button><b id="upVal"></b><button data-dir="up" data-step="1" type="button">+</button><span>代</span></div>
      <div class="stepper"><span>下</span><button data-dir="down" data-step="-1" type="button">−</button><b id="downVal"></b><button data-dir="down" data-step="1" type="button">+</button><span>代</span></div>
      <button id="backBtn" type="button">回到星系</button>
    </div>
  </div>

  <div id="bottom">
    <div id="legend"></div>
    <div id="timeline">
      <button id="tlToggle" type="button">时间轴</button>
      <button id="tlPlay" type="button" aria-label="播放">▶</button>
      <input id="tlRange" type="range" min="0" max="9" step="1" value="0" />
      <span id="tlLabel"></span>
    </div>
  </div>

  <aside id="panel" hidden>
    <button id="panelClose" type="button" aria-label="关闭">×</button>
    <div id="panelBody"></div>
  </aside>

  <footer>数据来源 <a href="https://warriors.fandom.com" target="_blank" rel="noopener">Warriors Wiki</a>（CC BY-SA）· 中文名为自动拼合，标「待核」者待校对</footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
